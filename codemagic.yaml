workflows:
  safir-chat-android:
    name: SAFIR Chat Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - safir_chat_env
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Verify backend environment
        script: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
      - name: Build web app
        script: npm run build
      - name: Create Android project
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync Android
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
