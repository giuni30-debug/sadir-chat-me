workflows:
  safir-chat-android:
    name: SAFIR Chat Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - safir_chat_env
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Verify backend environment
        script: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
      - name: Build web app
        script: npm run build
      - name: Create Android project
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync Android
        script: npx cap sync android
      - name: Apply SAFIR launcher icon everywhere
        script: |
          ICON="$CM_BUILD_DIR/public/safir-chat-icon.png"
          test -s "$ICON"
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            DENSITY=$1
            SIZE=$2
            DIR="android/app/src/main/res/mipmap-$DENSITY"
            mkdir -p "$DIR"
            sips -s format png -z "$SIZE" "$SIZE" "$ICON" --out "$DIR/ic_launcher.png" >/dev/null
            cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
            cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_foreground.png"
          done
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.apk
