workflows:
  safir-chat-android:
    name: SAFIR Chat Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - safir_chat_env
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Verify backend environment
        script: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
      - name: Build web app
        script: npm run build
      - name: Create Android project
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync Android
        script: npx cap sync android
      - name: Apply original SAFIR launcher icon
        script: |
          ICON="$CM_BUILD_DIR/public/safir-chat-icon.png"
          test -f "$ICON"
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          sips -z 48 48 "$ICON" --out android/app/src/main/res/mipmap-mdpi/ic_launcher.png >/dev/null
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          sips -z 72 72 "$ICON" --out android/app/src/main/res/mipmap-hdpi/ic_launcher.png >/dev/null
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          sips -z 96 96 "$ICON" --out android/app/src/main/res/mipmap-xhdpi/ic_launcher.png >/dev/null
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          sips -z 144 144 "$ICON" --out android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png >/dev/null
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          sips -z 192 192 "$ICON" --out android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png >/dev/null
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.apk
